
name: Dependency Failure Test

on:
  workflow_dispatch:

jobs:
  dependency-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install nonexistent package
        run: npm install package-that-does-not-exist-ece-test-12345
